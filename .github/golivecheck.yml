# Copy this file to .github/workflows/golivecheck.yml (this App cannot write workflow files).
# Cheap PR gate: security + a11y + API against test.seethinajayadileep.dev. No LLM key.
# www is the live site and is not the target.
name: golivecheck
on:
  pull_request:
permissions:
  contents: read
jobs:
  golivecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: seethinajayadileep/golivecheck@main
        with:
          target: https://test.seethinajayadileep.dev
          allow: test.seethinajayadileep.dev
          config: golivecheck.config.yaml
          only: security,a11y,api
