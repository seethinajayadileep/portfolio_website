name: www-seethinajayadileep
# Cheap PR gate for the live www host. Security is read-only (headers, cookies, CORS).
target: https://www.seethinajayadileep.dev
allow:
  - www.seethinajayadileep.dev
budget:
  maxMinutes: 8
  maxLlmCalls: 0
jobs:
  - type: security
    name: baseline
    url: /
  - type: a11y
    name: home
    url: /
    tags: [wcag2aa]
  - type: api
    name: health
    requests:
      - { method: GET, path: /, expectStatus: 200 }
