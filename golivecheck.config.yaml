name: test-seethinajayadileep
# Cheap PR gate for the named test subdomain. www is the live site and is not used here.
# Security is read-only (headers, cookies, CORS).
target: https://test.seethinajayadileep.dev
allow:
  - test.seethinajayadileep.dev
budget:
  maxMinutes: 8
  maxLlmCalls: 0
jobs:
  - type: security
    name: baseline
    url: /
  - type: a11y
    name: home
    url: /
    tags: [wcag2aa]
  - type: api
    name: health
    requests:
      - { method: GET, path: /, expectStatus: 200 }
