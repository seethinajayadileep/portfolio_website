name: www-seethinajayadileep
# Cheap PR gate for the live website. Security is read-only (headers, cookies, CORS).
target: https://www.seethinajayadileep.dev
allow:
  - www.seethinajayadileep.dev
budget:
  maxMinutes: 8
  maxLlmCalls: 0
jobs:
  - type: security
    name: baseline
    url: /
  - type: a11y
    name: home
    url: /
    tags: [wcag2aa]
  - type: a11y
    name: leetcode
    url: /leetcode
    tags: [wcag2aa]
  - type: a11y
    name: open-source
    url: /open-source
    tags: [wcag2aa]
  - type: a11y
    name: github
    url: /github
    tags: [wcag2aa]
  - type: a11y
    name: admin
    url: /admin
    tags: [wcag2aa]
  - type: api
    name: health
    requests:
      - { method: GET, path: /, expectStatus: 200 }
